name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup protoc
      # peridot-overseer-grpc compiles its protobufs at build time.
      uses: arduino/setup-protoc@v3.0.0

    - name: Build
      # No --features: contexts are selected at run time through the config
      # file, not at compile time. This builds the workspace's default members,
      # which is what the artifact image builds too.
      run: cargo build --release --locked --verbose

    - name: Build the artifact binaries
      # The runtime and the plugin must come from ONE cargo invocation: contexts
      # cross the plugin boundary as ordinary Rust types with no stable ABI, so
      # two separate builds can disagree and the plugin will fail to load.
      run: |
        cargo build --release --locked \
          -p peridot-cli -p peridot-overseer \
          -p tensor_batcher -p peridot-trace-plugin

    - name: Test
      run: cargo test --release --locked --verbose
