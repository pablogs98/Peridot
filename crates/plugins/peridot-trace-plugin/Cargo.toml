[package]
name = "peridot-trace-plugin"
version.workspace = true
authors.workspace = true
edition.workspace = true

# Built as a dynamic library and loaded at run time; it is deliberately NOT a dependency of the
# peridot binary, which is the whole point — adding it does not rebuild the runtime.
[lib]
crate-type = ["cdylib"]

[dependencies]
peridot = { workspace = true }
wasmtime-wasi = { workspace = true }
wiggle = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { version = "1.0.217", features = ["derive"] }
