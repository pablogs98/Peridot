[package]
name = "containerd-shim-peridot"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
tokio-util = "0.7.16"
containerd-shim-wasm = "1.0.0"
uuid = { version = "1.12.1", features = ["v4"] }

wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
peridot-overseer-grpc = { workspace = true }
libc = "0.2.177"
peridot = { workspace = true }
peridot-token-ctx = {path = "../contexts/peridot-token-ctx", optional = true}

[features]
token = ["dep:peridot-token-ctx"]

[[bin]]
name = "containerd-shim-peridot-v1"
path = "src/main.rs"