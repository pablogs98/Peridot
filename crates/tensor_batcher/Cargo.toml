[package]
name = "tensor_batcher"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "fs", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.79.0"
arrow = "50.0.0"
parquet = "50.0.0"
chrono = "=0.4.31"
rand = "0.8.5"
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }
